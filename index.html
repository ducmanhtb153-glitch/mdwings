<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDWINGS – Bán hàng & Sổ sách</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#15171a;--mut:#6b7178;--line:#e8eaed;--blue:#0070f4;--blued:#005ac3;--bluebg:#e6f1fe;--red:#e0262f;--redbg:#fdecec;--org:#f08a00;--orgbg:#fff3e0;--grn:#00a650;--grnd:#008c44;--grnbg:#e3f6eb;--gray:#f2f3f5}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1648px;margin:0 auto;padding:0 24px}
/* ---- header + menu ---- */
header{background:#fff}
header .wrap{display:flex;align-items:center;height:48px}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:17px;color:#1a2b49}
.logo{width:24px;height:24px;position:relative}
.logo:before,.logo:after{content:"";position:absolute;top:2px;width:13px;height:20px;border-radius:10px 2px 10px 2px}
.logo:before{left:0;background:#0070f4}.logo:after{left:10px;background:#00b14f;transform:scaleX(-1)}
.hright{margin-left:auto;display:flex;align-items:center;gap:18px;color:#3b4046;font-size:13.5px}
.hright .who{display:flex;align-items:center;gap:6px}
.hright .av{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
nav{background:var(--blue);position:sticky;top:0;z-index:20}
nav .wrap{display:flex;align-items:center;height:48px;gap:2px}
.ni{position:relative;height:100%;display:flex;align-items:center}
.ni>a{display:block;padding:8px 20px;line-height:20px;border-radius:8px;color:#fff;text-decoration:none;font-weight:600;white-space:nowrap}
.ni>a:hover{background:rgba(255,255,255,.12)}
.ni.on>a{background:var(--blued)}
.mega{display:none;position:absolute;top:38px;left:0;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:12px 8px;gap:8px;min-width:240px;z-index:30}
.ni:hover .mega{display:flex}
.mega .col{min-width:210px}
.mega .gt{font-size:12px;color:var(--mut);padding:4px 12px 6px}
.mega a{display:block;padding:8px 12px;border-radius:6px;color:var(--ink);text-decoration:none;white-space:nowrap}
.mega a:hover{background:var(--gray)}
.mega a.cur{color:var(--blue);font-weight:600}
nav .sell{margin-left:auto;background:#fff;color:var(--blue);border:0;border-radius:6px;padding:6px 16px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
nav .sell:hover{background:var(--bluebg)}
#banner:empty{display:none}#banner{max-width:1552px;margin:10px auto 0;padding:10px 14px;border-radius:8px;background:var(--orgbg);color:#9a5300}
#banner.err{background:var(--redbg);color:var(--red)}
main{padding:14px 0 50px}
/* ---- chung ---- */
.card{background:#fff;border-radius:8px}
input,select,textarea{padding:7px 10px;border:1px solid #d1d5da;border-radius:6px;background:#fff;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:16px;height:16px;margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:5px 12px;border-radius:8px;border:1px solid #d1d5da;color:#3e464f;background:#fff;cursor:pointer;white-space:nowrap;height:32px}
.btn:hover{background:var(--gray)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blued)}
.btn.out{border-color:var(--blue);color:var(--blue)}.btn.out:hover{background:var(--bluebg)}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.txt{border:0;background:none;padding:6px 6px}.btn.txt:hover{color:var(--blue)}
.btn.ico{width:32px;justify-content:center;padding:0}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;background:var(--gray);color:#3b4046}
.chip.g{background:var(--grnbg);color:var(--grnd)}.chip.r{background:var(--redbg);color:var(--red)}.chip.o{background:var(--orgbg);color:#c06a00}.chip.b{background:var(--bluebg);color:var(--blue)}
.red{color:var(--red)}.grn{color:var(--grnd)}.bl{color:var(--blue)}.mut{color:var(--mut)}
.empty{padding:36px;text-align:center;color:var(--mut)}
a.lk{color:var(--blue);cursor:pointer;text-decoration:none}a.lk:hover{text-decoration:underline}
/* ---- trang danh sách ---- */
.lp{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start}
.lp-title{font-size:20px;font-weight:700;height:32px;display:flex;align-items:center}
.lp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lp-top .search{position:relative;width:min(500px,100%)}
.lp-top .search input{width:100%;padding-left:32px;height:32px;border-radius:8px;border-color:#d1d5da}
.lp-top .search:before{content:"";position:absolute;left:11px;top:9px;width:10px;height:10px;border:1.6px solid #6b7178;border-radius:50%}
.lp-top .search:after{content:"";position:absolute;left:21px;top:20px;width:5px;height:1.6px;background:#6b7178;transform:rotate(45deg)}
.lp-top .sp{flex:1}
.filters{background:#fff;border-radius:8px;padding:12px 12px 2px;margin-top:12px;box-shadow:-8px 8px 24px rgba(0,0,0,.04)}
.filters .fs{margin-bottom:22px}.filters .fs .ft{font-size:14px;font-weight:600;color:#15171a;margin-bottom:10px}
.filters select{width:100%;height:32px;padding:0 10px;border:1px solid #d1d5da;border-radius:8px;font-size:14px;color:#15171a;background:#fff}
.filters .ftxt{height:32px;border-color:#d1d5da;font-size:14px;padding:0 12px}.filters .msel{border-color:#d1d5da;min-height:32px;padding:2px 8px}.filters .msel input{font-size:14px}
.filters .tbox{border-color:#d1d5da}.filters .opt{color:#15171a}
.frow2{display:flex;gap:8px;margin-top:8px;align-items:center}.frow2.rng{margin-top:0}.filters .fs.tight{margin-bottom:10px}.filters .fs .ft:empty{display:none}.frow2.rng .ftxt{min-width:0;padding:0 8px;font-size:13px}.frow2 select{width:72px;flex:none}.frow2 .ftxt{margin-top:0;flex:1}
.pills span{border-color:#d1d5da!important;color:#3e464f;padding:5px 12px!important;font-size:14px!important}.pills span.on{color:#fff;font-weight:500}.pills{gap:8px!important}
.fs{margin-bottom:16px}
.fs .ft{font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.fs .ft a{font-weight:400}
.fs .sub{font-size:12px;color:var(--mut);margin:-4px 0 4px}
.fs select,.fs input[type=text],.fs input[type=date]{width:100%}
.ftxt{width:100%;margin-top:8px;padding:7px 10px;border:1px solid #d6dbe1;border-radius:8px;font:inherit;font-size:13px;box-sizing:border-box}
.msel{position:relative;display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid #d6dbe1;border-radius:8px;padding:4px 6px;background:#fff;cursor:text;min-height:36px;box-sizing:border-box}
.msel input{border:0;outline:0;flex:1;min-width:80px;font:inherit;font-size:13px;padding:4px 2px;background:transparent}
.mtag{display:inline-flex;align-items:center;gap:4px;background:#e8f1fe;color:#0f62d6;border-radius:4px;padding:2px 6px;font-size:12px}.mtag b{cursor:pointer;font-weight:700}
.mdrop{display:none;position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:20;max-height:260px;overflow:auto;padding:4px 0}
.mdrop div{padding:7px 12px;font-size:13px;cursor:pointer}.mdrop div:hover{background:#f0f6ff}.mdrop .none{color:#888;cursor:default}
.opt{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.trow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tbox{flex:1;display:flex;align-items:center;justify-content:space-between;border:1px solid #d1d5da;border-radius:8px;padding:5px 9px;cursor:pointer;background:#fff;position:relative;min-height:32px}
.tbox .pop{position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:15;padding:6px}
.tbox .pop div{padding:7px 10px;border-radius:5px}.tbox .pop div:hover{background:var(--gray)}
.tbox .pop div.cur{color:var(--blue);font-weight:600}
.dates{display:grid;gap:6px;margin:-2px 0 8px 24px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills span{border:1px solid #d9dce1;border-radius:99px;padding:3px 12px;cursor:pointer;font-size:13px}
.pills span.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tw{background:#fff;border-radius:8px;margin-top:12px;overflow:hidden}
.ts{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.grid th{background:var(--bluebg);font-size:12px;font-weight:600;text-align:left;padding:0 10px;line-height:16px;height:40px;box-sizing:border-box;vertical-align:middle;border-bottom:1px solid #b3d4fc;white-space:nowrap}
.grid th input{vertical-align:middle;margin:0}.grid td .chip{line-height:18px;padding:1px 8px;vertical-align:middle}.grid td input[type=checkbox]{vertical-align:middle;margin:0}
.grid td{padding:10px;line-height:24px;border-bottom:1px solid var(--line);vertical-align:top}
.grid .r{text-align:right}
.grid .cb{width:34px;padding-right:0}.grid .st{width:30px;padding-left:4px;padding-right:0}
.grid tr.sum td{font-weight:600;border-bottom:1px solid var(--line)}
.grid tbody tr[data-row]{cursor:pointer}
.grid tbody tr[data-row]:hover td{background:#f7f8fa}
.grid tr.open td{background:#eef4fd!important;border-bottom:0}
.grid tr.open td:first-child{box-shadow:inset 1px 0 var(--blue)}.grid tr.open td:last-child{box-shadow:inset -1px 0 var(--blue)}
.grid tr.open td{border-top:1px solid var(--blue)}
.grid tr.dim td{color:#9aa0a6}
.grid tr.xp>td{padding:0;border:1px solid var(--blue);border-top:0;background:#fff}
.star{color:#9aa0a6;cursor:pointer;font-size:16px;line-height:1}.star.on{color:#f5a623}
.thumb{width:22px;height:22px;border-radius:4px;background:var(--bluebg);display:grid;place-items:center;color:var(--blue);font-size:12px}
.pager{display:flex;align-items:center;gap:8px;padding:10px 12px;color:var(--mut);font-size:13px}
.pager select{padding:3px 6px}
.pager .sp{flex:1}
.pager button{border:1px solid #d9dce1;background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
/* chi tiết dòng */
.dt{padding:0 18px}
.dtabs{display:flex;gap:28px;border-bottom:1px solid var(--line)}
.dtabs button{border:0;background:none;padding:12px 0 10px;cursor:pointer;color:#3b4046;border-bottom:2px solid transparent}
.dtabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.dbody{padding:16px 0}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dhead .t{font-size:18px;font-weight:700}
.dhead .rt{margin-left:auto;color:#3b4046}
.prod{display:flex;gap:16px;margin-bottom:16px}
.pimg{width:98px;height:98px;border-radius:8px;background:var(--bluebg);display:grid;place-items:center;flex:none}
.pimg:before{content:"";width:46px;height:34px;background:linear-gradient(135deg,transparent 45%,#4a90e2 46%) ,#4a90e2;clip-path:polygon(0 100%,35% 40%,55% 70%,75% 30%,100% 100%)}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 24px}
.fields.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fd{padding:6px 0 8px;border-bottom:1px solid var(--line)}
.fd .l{font-size:12px;color:var(--mut);margin-bottom:4px}
.fd .v{min-height:20px}.fd .v.e{color:#9aa0a6}
.fd input,.fd select{width:100%;padding:3px 8px}
.meta{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:12px;color:#3b4046}
.meta b{font-weight:400;color:var(--mut);margin-right:10px}
.meta select,.meta input{padding:3px 8px;min-width:180px}
.inner{border-collapse:collapse;width:100%;margin:6px 0 12px}
.inner th{background:var(--gray);font-size:12.5px;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap}
.inner td{padding:10px;border-bottom:1px solid var(--line)}
.inner .r{text-align:right}
.split{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;margin-top:6px}
.split textarea{width:100%;min-height:96px;resize:vertical}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot b{font-weight:600}
.dfoot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.dfoot .sp{flex:1}
.note{background:var(--gray);border-radius:8px;padding:10px 12px;margin:10px 0}
/* sổ quỹ */
.qsum{display:flex;justify-content:flex-end;gap:0;background:#fff;border-radius:8px;margin-top:12px;padding:14px 8px}
.qsum div{text-align:right;padding:0 24px;min-width:170px}
.qsum .k{color:var(--mut)}.qsum .v{font-size:16px;font-weight:700;margin-top:4px}
/* tổng quan */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:12px;align-items:start}
.dcard{background:#fff;border-radius:8px;padding:18px 20px;margin-bottom:12px}
.dcard h3{margin:0 0 14px;font-size:16px;font-weight:600}
.kq{display:grid;grid-template-columns:repeat(3,1fr)}
.kq>div{display:flex;gap:10px;padding:0 20px;border-left:1px solid var(--line)}.kq>div:first-child{border-left:0;padding-left:0}
.kq .ic{flex:none;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:2px}
.kq .ic.o{border-radius:4px;background:#f6a020}
.kq .ic.dn{background:none;color:var(--red);font-size:18px}.kq .ic.up{background:none;color:var(--grn);font-size:18px}
.kq .k{font-size:12.5px;font-weight:500}.kq .v{font-size:17px;font-weight:700;margin-top:4px}.kq .s{font-size:12px;color:var(--mut)}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dh h3{margin:0}.dh .sp{flex:1}
.dh select{padding:4px 8px;font-size:13px}
.pill{background:var(--bluebg);color:var(--blue);font-weight:600;font-size:16px;padding:4px 10px;border-radius:6px}
.ctabs{display:flex;gap:24px;margin:8px 0 14px;padding-left:12px}
.ctabs button{border:0;background:none;padding:6px 0;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;font-size:14px}
.ctabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:#6b7178}.chart line{stroke:#eceef1}
.chart rect.b{fill:var(--blue)}.chart rect.b:hover{fill:var(--blued)}
.chart rect.hb{fill:var(--blue)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.side .dcard{padding:14px 14px}
.act{display:flex;gap:10px;padding:10px 0 12px;position:relative}
.act:not(:last-child):before{content:"";position:absolute;left:12px;top:36px;bottom:-4px;width:1px;background:var(--line)}
.act .ai{flex:none;width:25px;height:25px;border-radius:50%;background:var(--gray);display:grid;place-items:center;font-size:12px}
.act .tx{font-size:13px;line-height:1.5}.act .tx b{font-weight:600}
.act .tm{font-size:12px;color:var(--mut);margin-top:2px}
.fin div{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}
.fin b{font-weight:600}
.alert{display:flex;gap:10px;align-items:center;font-size:13px}
.alert .ai{color:var(--org);font-size:18px}
/* báo cáo */
.sheet{background:#fff;margin:0 auto;padding:22px 12px 30px;max-width:1120px;font-family:Arial,Helvetica,sans-serif;position:relative;color:#222}
.sheet .made{position:absolute;left:14px;top:30px;font-size:11.5px;color:#333}
.sheet h2{text-align:center;margin:0 0 4px;font-size:21px;font-weight:700;font-family:Arial,Helvetica,sans-serif;color:#222}
.sheet .rg{text-align:center;color:#222;font-size:12px;margin-bottom:12px;line-height:1.35}
.sheet table{width:100%;border-collapse:collapse}.sheet table th{background:#b3e5fc;font-size:12.5px;font-weight:700;color:#222;padding:12px 8px;text-align:left;white-space:nowrap;border-top:1px solid #9fc9de;border-bottom:1px solid #9fc9de}
.sheet table td{padding:11px 8px;border-bottom:1px solid #c9ccd0;font-size:12px;color:#222}
.sheet .r{text-align:right}
.sheet tr.tt td{font-weight:700;background:#f6ecd6}
.sheet tr.ind td:first-child{padding-left:28px}
.rbox{background:#8a949e;border-radius:8px;margin-top:12px;overflow:hidden}.rpage{padding:0 16px 16px;overflow-x:auto}
/* hộp thoại */
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:50px 10px;overflow-y:auto;z-index:60}
.modal.hidden{display:none}
.box{background:#fff;border-radius:10px;width:100%;max-width:780px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.box>h3:first-child{margin:0;padding:16px 20px;font-size:17px;border-bottom:1px solid var(--line)}
.mb{padding:16px 20px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.fgrid label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
textarea{width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--red)}
/* màn hình nhập hàng / kiểm kho (trong trang) */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 346px;gap:10px;min-height:calc(100vh - 110px)}
.ed-l{display:flex;flex-direction:column;min-width:0}
.ed-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ed-top .back{border:0;background:none;font-size:20px;cursor:pointer;padding:0 4px}
.ed-top h2{margin:0;font-size:20px}
.srch{position:relative;flex:0 1 410px}
.srch input{width:100%;height:34px;padding-left:12px}
.dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:430px;overflow-y:auto;z-index:25}
.dd.hidden{display:none}
.dd .it{display:flex;gap:12px;padding:10px 14px;cursor:pointer}
.dd .it:hover,.dd .it.hl{background:var(--gray)}
.dd .it .ph{width:40px;height:40px;border-radius:6px;background:var(--gray);flex:none}
.dd .it .nm{font-weight:600;line-height:1.35}.dd .it .sb{font-size:12.5px;color:#3b4046;margin-top:4px}
.dd .it .pr{margin-left:auto;color:var(--blue);font-weight:600;white-space:nowrap}
.dd .add{text-align:center;padding:10px;border-top:1px solid var(--line)}
.ed-tbl{background:#fff;border-radius:8px;flex:1;overflow:auto}
.ed-tbl th{background:var(--bluebg);font-size:13px;font-weight:600;padding:11px 10px;text-align:left;position:sticky;top:0}
.ed-tbl td{padding:10px;border-bottom:1px solid var(--line)}
.ed-tbl .r{text-align:right}
.ed-tbl input{width:100%;text-align:right;border:0;border-bottom:1px solid #d9dce1;border-radius:0;padding:4px 2px}
.ed-r{background:#fff;border-radius:8px;padding:14px;display:flex;flex-direction:column}
.ed-r .row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.ed-r .row input,.ed-r .row select{width:150px;text-align:right}
.ed-r .row select{text-align:left}
.ed-r .big{font-weight:700}.ed-r .big .v{color:var(--blue)}
.ed-r .sp{flex:1}
.ed-r .acts{display:flex;gap:8px;margin-top:12px}.ed-r .acts button{flex:1;height:44px;font-weight:600;font-size:15px;justify-content:center}
.ed-empty{text-align:center;padding:90px 20px;color:#3b4046}
/* màn hình bán hàng */

function periodRange(p){const n=new Date(),t=today();
  if(p==='today')return[t,t];
  if(p==='yesterday'){const d=new Date(n);d.setDate(d.getDate()-1);return[ymd(d),ymd(d)]}
  if(p==='7d'){const d=new Date(n);d.setDate(d.getDate()-6);return[ymd(d),t]}
  if(p==='week'||p==='lastweek'){const d=new Date(n);d.setDate(d.getDate()-((d.getDay()+6)%7)-(p==='lastweek'?7:0));const e=new Date(d);e.setDate(e.getDate()+6);return[ymd(d),ymd(e)]}
  if(p==='30d'){const d=new Date(n);d.setDate(d.getDate()-29);return[ymd(d),t]}
  if(p==='quarter'||p==='lastquarter'){let q=Math.floor(n.getMonth()/3)-(p==='lastquarter'?1:0),y=n.getFullYear();if(q<0){q=3;y--}return[ymd(new Date(y,q*3,1)),ymd(new Date(y,q*3+3,0))]}
  if(p==='lastyear')return[(n.getFullYear()-1)+'-01-01',(n.getFullYear()-1)+'-12-31'];
  if(p==='lastmonth')return[ymd(new Date(n.getFullYear(),n.getMonth()-1,1)),ymd(new Date(n.getFullYear(),n.getMonth(),0))];
  if(p==='year')return[n.getFullYear()+'-01-01',n.getFullYear()+'-12-31'];
  if(p==='all')return['0000-00-00','9999-12-31'];
  return[monthStart(),ymd(new Date(n.getFullYear(),n.getMonth()+1,0))]}

function calGrid(ym,opt){const y=+ym.slice(0,4),m=+ym.slice(5,7)-1,first=new Date(y,m,1),off=(first.getDay()+6)%7,start=new Date(y,m,1-off),cells=[];
  const last=new Date(y,m+1,0).getDate(),rows=Math.ceil((off+last)/7);
  for(let i=0;i<rows*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=ymd(d),inM=d.getMonth()===m;if((opt.max&&s>opt.max)||(opt.min&&s<opt.min)||(!inM&&d>first)){cells.push('<span class="nx"></span>');continue}
    const cls=[inM?'':'out',s===today()?'td':'',opt.sel.includes(s)?'sel':'',opt.a&&opt.b&&s>opt.a&&s<opt.b&&inM?'rng':'',(d.getDay()===0||d.getDay()===6)&&inM?'we':''].filter(Boolean).join(' ');
    cells.push(`<span class="${cls}" data-dpd="${s}" data-side="${opt.side}">${d.getDate()}</span>`)}

  el.addEventListener('click',e=>{e.stopPropagation();const done=onClick(e);if(done===true)dpClose();else{el.innerHTML=html();place()}});

function derive(){
  const st={},cq={},ca={};
  for(const [id,p] of S.products){const q=+p.openStock||0;st[id]=q;cq[id]=q;ca[id]=q*(+p.openCost||0)}
  for(const pu of S.purchases.values()){if(pu.canceled)continue;const g=sum(pu.items||[],i=>i.qty*i.price),sh=g?(+pu.total||0)/g:1;for(const it of pu.items||[]){if(!(it.pid in st))continue;const q=+it.qty||0;st[it.pid]+=q;cq[it.pid]+=q;ca[it.pid]+=q*(+it.price||0)*sh}}
  const avg={};for(const id in st){avg[id]=cq[id]>0?ca[id]/cq[id]:(+S.products.get(id).openCost||0)}
  for(const o of S.orders.values()){if(o.status==='Đã hủy')continue;for(const it of o.items||[])if(it.pid in st)st[it.pid]-=+it.qty||0}
  const retQty={},ordRet={};
  for(const r of S.returns.values()){if(r.canceled)continue;(ordRet[r.orderId]=ordRet[r.orderId]||[]).push(r);for(const it of r.items||[]){if(it.pid in st)st[it.pid]+=+it.qty||0;const k=r.orderId+'|'+it.pid;retQty[k]=(retQty[k]||0)+(+it.qty||0)}}
  for(const k of S.stocktakes.values()){if(k.canceled)continue;for(const it of k.items||[])if(it.pid in st)st[it.pid]+=+it.diff||0}
  const cd={},sd={},bal={},orderPaid={},purPaid={},retPaid={};ACCOUNTS.forEach(a=>bal[a]=0);
  for(const c of S.customers.values())cd[c.id]=+c.openDebt||0;
  for(const s of S.suppliers.values())sd[s.id]=+s.openDebt||0;
  for(const o of S.orders.values()){if(o.status==='Đã hủy')continue;const k=o.cid||'';cd[k]=(cd[k]||0)+(+o.total||0)}
  for(const r of S.returns.values()){if(r.canceled)continue;const k=r.cid||'';cd[k]=(cd[k]||0)-(+r.total||0)}
  for(const p of S.purchases.values()){if(p.canceled)continue;sd[p.sid]=(sd[p.sid]||0)+(+p.total||0)}
  for(const c of S.cash.values()){if(c.canceled)continue;const a=+c.amount||0;
    bal[c.account]=(bal[c.account]||0)+(c.type==='thu'?a:-a);
    if(c.partnerType==='customer'){const k=c.partnerId||'';cd[k]=(cd[k]||0)+(c.type==='thu'?-a:a)}
    if(c.partnerType==='supplier'){sd[c.partnerId]=(sd[c.partnerId]||0)+(c.type==='chi'?-a:a)}
    if(c.orderId)orderPaid[c.orderId]=(orderPaid[c.orderId]||0)+a;
    if(c.purchaseId)purPaid[c.purchaseId]=(purPaid[c.purchaseId]||0)+a;
    if(c.returnId)retPaid[c.returnId]=(retPaid[c.returnId]||0)+a}
  D={st,avg,cd,sd,bal,orderPaid,purPaid,retPaid,retQty,ordRet};
}

function moves(pid){const m=[];

  for(const o of S.orders.values()){if(o.status==='Đã hủy')continue;for(const i of o.items||[])if(i.pid===pid)m.push({code:o.code,ts:o.createdAt,date:o.date,kind:'Bán hàng',q:-(+i.qty||0),price:+i.price||0,cost:+i.cost||0,who:o.cname})}
  for(const r of S.returns.values()){if(r.canceled)continue;for(const i of r.items||[])if(i.pid===pid)m.push({code:r.code,ts:r.createdAt,date:r.date,kind:'Khách trả hàng',q:+i.qty||0,price:+i.price||0,who:r.cname})}
  for(const k of S.stocktakes.values()){if(k.canceled)continue;for(const i of k.items||[])if(i.pid===pid&&i.diff)m.push({code:k.code,ts:k.createdAt,date:k.date,kind:'Kiểm kho',q:+i.diff||0,price:0,who:''})}

function openPOS(preset){

    cid:c?c.id:'',partner:c?cLabel(c):(o.cname&&o.cname!=='Khách lẻ'?o.cname:''),channel:o.channel||d.channel,disc:+o.discount||0,ship:+o.ship||0,note:o.note||'',track:edit?o.tracking||'':'',st:edit?o.status:d.st});
  if(edit){d.editId=o.id;d.editCode=o.code;d.date=o.date;d.paid=D.orderPaid[o.id]||0;d.acc=(()=>{const cs=vals('cash').filter(x=>x.orderId===o.id&&!x.canceled);return cs.length?cs[cs.length-1].account:d.acc})()}

function calcSale(d=sale()){const goods=d.items.reduce((s,i)=>s+i.qty*i.price,0),qty=d.items.reduce((s,i)=>s+i.qty,0);if(d.discPct!=null)d.disc=Math.round(goods*d.discPct/100);const need=goods-(+d.disc||0)+(+d.ship||0),paid=d.paid===null?need:d.paid;return{goods,qty,need,paid,diff:paid-need}}

function quickAmounts(n){if(n<=0)return[];const s=new Set([n]);[1e3,1e4,5e4,1e5,5e5,1e6].forEach(u=>{const v=Math.ceil(n/u)*u;if(v>n)s.add(v)});return[...s].sort((a,b)=>a-b).slice(0,6)}
function updSale(){
  const d=sale(),c=calcSale(d),set=(id,v)=>{const e=$('#'+id);if(e)e.textContent=v};
  set('ps-goods',fm(c.goods));set('ps-need',fm(c.need));set('ps-cnt',fm(c.qty));const di=$('#ps-disc');if(di)di.value=fm(d.disc);
  const pi=$('#ps-paid');if(pi&&d.paid===null&&document.activeElement!==pi)pi.value=fm(c.need);
  set('ps-difl',c.diff>=0?'Tiền thừa trả khách':'Khách còn nợ');
  const df=$('#ps-dif');if(df){df.textContent=fm(Math.abs(c.diff));df.className=c.diff<0?'red':''}
  const q=$('#ps-quick');if(q){const a=d.acc==='Tiền mặt'?quickAmounts(c.need):[];q.style.display=a.length?'':'none';q.innerHTML=a.map(v=>`<button data-pos="quick" data-v="${v}">${fm(v)}</button>`).join('')}

function searchProducts(t){t=t.trim().toLowerCase();if(!t)return[];const r=[];for(const p of S.products.values()){if(p.hidden)continue;const sk=String(p.sku||'').toLowerCase(),nm=String(p.name||'').toLowerCase();if(sk.includes(t)||nm.includes(t))r.push([sk===t?0:sk.startsWith(t)?1:2,p])}return r.sort((a,b)=>a[0]-b[0]).slice(0,12).map(x=>x[1])}

function searchCustomers(t){t=String(t||'').trim().toLowerCase();if(!t)return[];const dg=t.replace(/\D/g,'');const r=[];for(const c of S.customers.values()){const nm=String(c.name||'').toLowerCase(),cd=String(c.code||'').toLowerCase(),ph=String(c.phone||'').replace(/\D/g,'');let sc=-1;if(cd===t||(dg.length>=3&&ph===dg))sc=0;else if(nm.startsWith(t)||cd.startsWith(t)||(dg.length>=3&&ph.startsWith(dg)))sc=1;else if(nm.includes(t)||cd.includes(t)||(dg.length>=3&&ph.includes(dg)))sc=2;if(sc>=0)r.push([sc,-(c.createdAt||0),c])}return r.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,20).map(x=>x[2])}

const short=v=>{const a=Math.abs(v);return a>=1e9?(v/1e9).toFixed(1).replace('.0','')+' tỷ':a>=1e6?(v/1e6).toFixed(a>=1e7?0:1).replace('.0','')+' tr':a>=1e3?(v/1e3).toFixed(a>=1e4?0:1).replace('.0','')+'k':String(Math.round(v))};
function niceMax(m){if(m<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(m))),f=m/e;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=4?4:f<=5?5:f<=8?8:10;return n*e}
function barChart(labels,values,tips){
  const W=1000,H=330,L=48,R=6,T=10,B=26,iw=W-L-R,ih=H-T-B,max=niceMax(Math.max(...values,0)),n=Math.max(labels.length,1),bw=Math.min(22,iw/n*0.5);

  const step=n>24?Math.ceil(n/24):1;

document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.msel)setTimeout(()=>{const dd=t.parentElement&&t.parentElement.querySelector('.mdrop');if(dd)dd.style.display='none'},150)});
document.addEventListener('mousedown',e=>{const p=e.target.closest('[data-mpick]');if(p){e.preventDefault();const inp=p.closest('.msel').querySelector('[data-msel]'),k=inp.dataset.msel;F[k].push(p.dataset.mpick);F.pg=0;F.exp=null;renderSide();renderBody();const n=document.querySelector(`[data-msel="${k}"]`);if(n)n.focus();return}
 const d=e.target.closest('[data-act="mseldel"]');if(d){e.preventDefault();const a=F[d.dataset.k],i=a.indexOf(d.dataset.v);if(i>=0)a.splice(i,1);F.pg=0;F.exp=null;renderSide();renderBody();return}
 const m=e.target.closest('.msel');if(m&&!e.target.matches('input')){e.preventDefault();m.querySelector('input').focus()}},true);
</script>
</body>
</html>
